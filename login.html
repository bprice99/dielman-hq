<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#00593D"><title>Dielman HQ</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#00593D;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  form{background:#fff;border-radius:20px;padding:36px 30px;width:100%;max-width:360px;margin:16px;text-align:center}
  h1{font-size:22px;margin:0 0 4px;color:#00593D}
  p{font-size:14px;color:#66716b;margin:0 0 22px}
  input{width:100%;padding:14px 16px;border:1px solid #d5ddd9;border-radius:12px;font-size:16px;margin-bottom:12px}
  button{width:100%;padding:14px;border:0;border-radius:12px;background:#00593D;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
  .bad{color:#b3261e;font-size:14px;font-weight:600;margin:-4px 0 12px;display:none}
</style></head>
<body>
<form method="post" action="/login">
  <h1>Dielman HQ</h1>
  <p>Dielman Moving &amp; Storage</p>
  <input type="password" name="password" placeholder="Password" autofocus required>
  <div class="bad" id="bad">Wrong password. Try again.</div>
  <button type="submit">Log in</button>
</form>
<script>
var q=location.search,b=document.getElementById('bad');
if(/bad=1/.test(q))b.style.display='block';
if(/bad=locked/.test(q)){b.textContent='Too many tries. Wait 15 minutes and try again.';b.style.display='block'}
</script>
</body></html>
